upstream dayoff_api {
    zone dayoff_api 64k;
    # Docker DNS: API 교체로 IP가 바뀌거나 잠시 없어져도 Nginx는 계속 실행합니다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server api:4000 resolve;
}

# HTTP (Cloudflare Full(strict) 시에도 헬스/리다이렉트용으로 유지)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    include /etc/nginx/dayoff-locations.conf;
}

# HTTPS — 인증서는 호스트 ./certs → /etc/nginx/certs 마운트 (cert.pem, key.pem)
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/dayoff-locations.conf;
}
