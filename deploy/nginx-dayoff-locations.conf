# server 블록 안에서 include (80 / 443 공통)
location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}

# Cloudflare 등이 GET /auth/me 를 캐시하지 않도록
location /auth/ {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# 프론트에도 /shop 경로가 있으므로 실제 API 하위 경로만 백엔드로 전달합니다.
# 그 외 /shop 및 /shop/:slug 요청은 아래 SPA fallback에서 처리합니다.
location ~ ^/shop/(?:categories|products|upload|my-reviews|orders|cart|checkout|naver-order)(?:/|$) {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

location ~ ^/shop/admin/(?:categories|products|upload|reviews|orders|naver-pay|naver-order|storage)(?:/|$) {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# 쿠폰 API는 `/coupons` 자체(관리자 목록 조회·쿠폰 등록)도 사용합니다.
# `location /coupons/` 처럼 슬래시로 끝나는 prefix로만 받으면 Nginx가 `/coupons` 요청을
# `/coupons/` 로 301 리다이렉트하고, 브라우저는 POST를 GET으로 바꿔 다시 보내므로
# 쿠폰 등록이 목록 조회로 바뀌어 "등록 성공"으로 보이지만 저장되지 않습니다.
location ~ ^/coupons(?:/|$) {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

location /api/contact/ {
    client_max_body_size 6m;
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

location /uploads/ {
    alias /var/www/uploads/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# public/assets는 파일명이 고정되어 교체될 수 있으므로 짧게 캐시합니다.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
}

location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
