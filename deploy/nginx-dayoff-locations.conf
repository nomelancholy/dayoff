# server 블록 안에서 include (80 / 443 공통)
# Cloudflare 등이 GET /auth/me 를 캐시하지 않도록
location /auth/ {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

# 프론트에도 /shop 경로가 있으므로 실제 API 하위 경로만 백엔드로 전달합니다.
# 그 외 /shop 및 /shop/:slug 요청은 아래 SPA fallback에서 처리합니다.
location ~ ^/shop/(?:categories|products|upload|my-reviews|orders|cart|checkout)(?:/|$) {
    proxy_pass http://dayoff_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store, max-age=0" always;
}

