# 프로덕션: Postgres + API + Nginx(정적 + /auth /shop /coupons /uploads 프록시)
# 사용: .env.deploy 복사 후 값 채우기 → docker compose -f docker-compose.prod.yml up -d
# 이미지 레지스트리: GitHub Actions가 ghcr.io 에 푸시한 뒤 Droplet에서 pull

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-dayoff}
    volumes:
      - dayoff_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dayoff}']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks: [dayoff]

  api:
    image: ${IMAGE_API:?IMAGE_API required e.g. ghcr.io/user/dayoff-api:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dayoff}
      PORT: ${PORT:-4000}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required same as PUBLIC_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_CALLBACK_URL: ${KAKAO_CALLBACK_URL:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_CALLBACK_URL: ${NAVER_CALLBACK_URL:-}
      # 주문형 키는 결제형/네이버 로그인 인증정보와 별개입니다.
      NAVER_ORDER_ENABLED: ${NAVER_ORDER_ENABLED:-false}
      NAVER_ORDER_AUDIENCE: ${NAVER_ORDER_AUDIENCE:-review}
      NAVER_ORDER_REVIEW_USER_IDS: ${NAVER_ORDER_REVIEW_USER_IDS:-}
      NAVER_REVIEW_LOGIN_ENABLED: ${NAVER_REVIEW_LOGIN_ENABLED:-false}
      NAVER_REVIEW_LOGIN_ID: ${NAVER_REVIEW_LOGIN_ID:-npay_test}
      NAVER_REVIEW_USER_ID: ${NAVER_REVIEW_USER_ID:-}
      NAVER_ORDER_MODE: ${NAVER_ORDER_MODE:-test}
      NAVER_ORDER_MERCHANT_ID: ${NAVER_ORDER_MERCHANT_ID:-}
      NAVER_ORDER_CERTI_KEY: ${NAVER_ORDER_CERTI_KEY:-}
      NAVER_ORDER_BUTTON_KEY: ${NAVER_ORDER_BUTTON_KEY:-}
      NAVER_ORDER_ACCOUNT_ID: ${NAVER_ORDER_ACCOUNT_ID:-}
      NAVER_ORDER_PRODUCTION_READY: ${NAVER_ORDER_PRODUCTION_READY:-false}
      NAVER_ORDER_API_MODE: ${NAVER_ORDER_API_MODE:-sandbox}
      NAVER_ORDER_API_CLIENT_ID: ${NAVER_ORDER_API_CLIENT_ID:-}
      NAVER_ORDER_API_CLIENT_SECRET: ${NAVER_ORDER_API_CLIENT_SECRET:-}
      NAVER_PAY_LEGACY_CHECKOUT_ENABLED: 'false'
      NAVER_PAY_ENABLED: ${NAVER_PAY_ENABLED:-false}
      NAVER_PAY_MODE: ${NAVER_PAY_MODE:-production}
      NAVER_PAY_CLIENT_ID: ${NAVER_PAY_CLIENT_ID:-}
      NAVER_PAY_CLIENT_SECRET: ${NAVER_PAY_CLIENT_SECRET:-}
      NAVER_PAY_CHAIN_ID: ${NAVER_PAY_CHAIN_ID:-}
      # DigitalOcean Spaces 이미지 저장소 (키가 있으면 자동 활성화, false면 로컬 폴백)
      SPACES_ENABLED: ${SPACES_ENABLED:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_CDN_URL: ${SPACES_CDN_URL:-}
      SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
      # resend 이메일 (미설정 시 메일 전송만 skip)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      CONTACT_ENABLED: ${CONTACT_ENABLED:-false}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    volumes:
      - dayoff_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:" + (process.env.PORT || "4000") + "/", { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks: [dayoff]

  web:
    image: ${IMAGE_WEB:?IMAGE_WEB required e.g. ghcr.io/user/dayoff-web:latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN required no trailing slash}
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
        VITE_CHECKOUT_ENABLED: ${VITE_CHECKOUT_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 3s
      retries: 6
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # 호스트에 cert.pem / key.pem (Full strict: Cloudflare Origin CA 또는 Let’s Encrypt 등)
      - ${CERTS_HOST_PATH:-./certs}:/etc/nginx/certs:ro
      # 업로드 파일은 Nginx가 직접 전송하고 장기 캐시합니다.
      - dayoff_uploads:/var/www/uploads:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks: [dayoff]

volumes:
  dayoff_pgdata:
  dayoff_uploads:

networks:
  dayoff:
    driver: bridge
