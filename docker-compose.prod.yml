# 프로덕션: Postgres + API + Nginx(정적 + /auth /shop /coupons /uploads 프록시)
# 사용: .env.deploy 복사 후 값 채우기 → docker compose -f docker-compose.prod.yml up -d
# 이미지 레지스트리: GitHub Actions가 ghcr.io 에 푸시한 뒤 Droplet에서 pull

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-dayoff}
    volumes:
      - dayoff_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dayoff}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [dayoff]

  api:
    image: ${IMAGE_API:?IMAGE_API required e.g. ghcr.io/user/dayoff-api:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dayoff}
      PORT: ${PORT:-4000}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL required same as PUBLIC_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_CALLBACK_URL: ${KAKAO_CALLBACK_URL:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_CALLBACK_URL: ${NAVER_CALLBACK_URL:-}
    volumes:
      - dayoff_uploads:/app/uploads
    networks: [dayoff]

  web:
    image: ${IMAGE_WEB:?IMAGE_WEB required e.g. ghcr.io/user/dayoff-web:latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN required no trailing slash}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${HTTP_PORT:-80}:80'
    networks: [dayoff]

volumes:
  dayoff_pgdata:
  dayoff_uploads:

networks:
  dayoff:
    driver: bridge
