name: Build and deploy

on:
  push:
    branches: [main]

# 겹친 배포가 서로 실행 중인 컨테이너를 교체하지 않도록 직렬화합니다.
concurrency:
  group: dayoff-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API_NAME: dayoff-api
  IMAGE_WEB_NAME: dayoff-web
  # Node 20 액션 경고 대비 (상위 액션을 최신으로 올리는 것이 본해결)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names (lowercase owner)
        id: img
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=${{ env.REGISTRY }}/${owner_lc}/${{ env.IMAGE_API_NAME }}" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${owner_lc}/${{ env.IMAGE_WEB_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Require PUBLIC_ORIGIN for web image
        run: |
          if [ -z "${{ secrets.PUBLIC_ORIGIN }}" ]; then
            echo "::error::Repository secret PUBLIC_ORIGIN 이 없습니다. 예: http://152.x.x.x 또는 https://도메인 (끝 / 없음)"
            exit 1
          fi

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.api }}:latest
            ${{ steps.img.outputs.api }}:${{ github.sha }}

      - name: Build and push Web (Vite + Nginx)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile.web
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.PUBLIC_ORIGIN }}
            VITE_NAVER_MAP_CLIENT_ID=${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
            VITE_CHECKOUT_ENABLED=${{ vars.VITE_CHECKOUT_ENABLED || 'false' }}
          tags: |
            ${{ steps.img.outputs.web }}:latest
            ${{ steps.img.outputs.web }}:${{ github.sha }}

  deploy:
    needs: build-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH — pull images and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          CONTACT_DEPLOY_ENABLED: ${{ vars.CONTACT_ENABLED }}
          CONTACT_DEPLOY_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_DEPLOY_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          CONTACT_DEPLOY_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CONTACT_DEPLOY_ENABLED,CONTACT_DEPLOY_API_KEY,CONTACT_DEPLOY_FROM_EMAIL,CONTACT_DEPLOY_TO_EMAIL
          script: |
            set -e
            cd "${{ secrets.DROPLET_APP_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            # 기존 환경설정을 백업한 뒤 문의 설정만 반영하며 값은 로그에 남기지 않습니다.
            python3 deploy/configure-contact.py .env.deploy
            # 작은 Droplet에서 이전 이미지/빌드 캐시 때문에 pull이 실패하지 않도록 공간 확보
            docker image prune -af
            docker builder prune -af
            df -h /
            docker compose -f docker-compose.prod.yml --env-file .env.deploy pull
            # 기존 웹 서버는 DB/API가 준비될 때까지 유지합니다.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --wait --wait-timeout 120 postgres
            # API 진입점의 마이그레이션 전에 DB를 백업하고 덤프 형식을 검사합니다.
            umask 077
            mkdir -p backups
            chmod 700 backups
            backup="backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}.dump"
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup"
            test -s "$backup"
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T postgres pg_restore --list < "$backup" > /dev/null
            echo "Database backup verified: $backup"
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --no-deps --wait --wait-timeout 180 api
            # 새 Nginx 설정/인증서를 기존 웹 서버를 내리기 전에 검증합니다.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy run --rm --no-deps web nginx -t
            docker compose -f docker-compose.prod.yml --env-file .env.deploy up -d --no-deps --wait --wait-timeout 60 web
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T web wget -q -O /dev/null http://127.0.0.1/shop/products
            # 설정 유무만 기록하고 인증 키·메일 주소는 로그에 출력하지 않습니다.
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T api node -e 'const e=process.env; console.log(JSON.stringify({contactEnabled:e.CONTACT_ENABLED==="true",contactRecipientConfigured:!!e.CONTACT_TO_EMAIL,resendKeyConfigured:!!e.RESEND_API_KEY,resendSenderConfigured:!!e.RESEND_FROM_EMAIL,resendTestSender:/@resend\.dev/i.test(e.RESEND_FROM_EMAIL||"")}))'
            docker image prune -af
            docker builder prune -af
            docker system df
            df -h /
