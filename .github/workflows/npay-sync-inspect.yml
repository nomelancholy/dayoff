name: Inspect Npay payment boundary
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dayoff-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DROPLET_APP_PATH }}"
            docker compose -f docker-compose.prod.yml --env-file .env.deploy logs --since 2h --no-color web 2>&1 | python3 -c 'import sys,json; lines=[l.strip() for l in sys.stdin if "npay_xml at=" in l];print("XML_TIMINGS",json.dumps(lines[-30:]))'
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T api node - <<'JS'
            const {Pool}=require('pg');
            (async()=>{const db=new Pool({connectionString:process.env.DATABASE_URL});try{
              const {rows:history}=await db.query("SELECT mode,status,payment_date IS NOT NULL AS payment_seen,applied_consumed FROM naver_order_inventory WHERE mode='sandbox' AND product_order_id='2026101754129520'");
              console.log(JSON.stringify({previousSuccessfulTest:history}));
              const {rows}=await db.query("SELECT state,validated_at,redeemed_at IS NOT NULL AS payment_seen,provider_order_id IS NOT NULL AS provider_order_seen FROM naver_coupon_checkouts WHERE mode='sandbox' ORDER BY created_at DESC LIMIT 1");
              console.log(JSON.stringify({latestSandbox:rows,productionCouponEnabled:process.env.NAVER_COUPON_CHECKOUT_ENABLED==='true'}));
            }finally{await db.end()}})().catch(()=>{console.error('INSPECTION_FAILED');process.exit(1)});
            JS
