name: Audit Npay historical checkout
on:
  workflow_dispatch:
    inputs:
      result_public_key:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dayoff-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          SANDBOX_RESULT_PUBLIC_KEY: ${{ inputs.result_public_key }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: SANDBOX_RESULT_PUBLIC_KEY
          script: |
            set -eu
            cd "${{ secrets.DROPLET_APP_PATH }}"
            python3 - <<'PYENV' | docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T -e SANDBOX_RESULT_PUBLIC_KEY="$SANDBOX_RESULT_PUBLIC_KEY" api node -e "$(printf '%s' '' | base64 -d | gzip -d)"
            from pathlib import Path
            import json,re
            names=['NAVER_ORDER_MERCHANT_ID','NAVER_ORDER_CERTI_KEY','NAVER_ORDER_BUTTON_KEY','NAVER_ORDER_ACCOUNT_ID','FRONTEND_URL']
            def read(p):
                text=p.read_text()
                def value(k):
                    m=re.search(r'^'+k+r'=(.*)$',text,re.M)
                    return m.group(1).strip().strip("\"'") if m else ''
                return {k:value(k) for k in names}
            backups=[{'snapshot':p.name,'values':read(p)} for p in sorted(Path('.').glob('.env.deploy.before-npay-production.*.local'))]
            print(json.dumps({'current':read(Path('.env.deploy')),'backups':backups}))
            PYENV
