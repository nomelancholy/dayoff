name: Refresh Npay sandbox checkout
on:
  workflow_dispatch:
    inputs:
      result_public_key:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dayoff-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          SANDBOX_RESULT_PUBLIC_KEY: ${{ inputs.result_public_key }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: SANDBOX_RESULT_PUBLIC_KEY
          script: |
            set -eu
            cd "${{ secrets.DROPLET_APP_PATH }}"
            sh deploy/test-npay-coupon-sandbox.sh sync
            docker compose -f docker-compose.prod.yml --env-file .env.deploy exec -T api node - <<'JS'
            const {Pool}=require('pg');
            (async()=>{const db=new Pool({connectionString:process.env.DATABASE_URL});try{
              await db.query('BEGIN');
              const {rows}=await db.query("SELECT c.id,c.state,c.redeemed_at,c.provider_order_id,c.created_at FROM naver_coupon_checkouts c JOIN users u ON c.user_id=u.id WHERE c.mode='sandbox' AND u.email='npay_test@dayoff.invalid' AND c.released_at IS NULL FOR UPDATE OF c");
              if(rows.some(r=>r.state!=='registered'||r.redeemed_at||r.provider_order_id||Date.now()-r.created_at.getTime()>23*3600000))throw Error('SANDBOX_ORDER_REQUIRES_REVIEW');
              for(const r of rows)await db.query("UPDATE naver_coupon_checkouts SET state='failed',released_at=now(),updated_at=now() WHERE id=$1 AND mode='sandbox'",[r.id]);
              await db.query('COMMIT');console.log(JSON.stringify({sandboxOnly:true,oldCheckoutTokensBlocked:rows.length}));
            }catch(e){await db.query('ROLLBACK');throw e}finally{await db.end()}})().catch(()=>{console.error('REFRESH_BLOCKED');process.exit(1)});
            JS
            sh deploy/test-npay-coupon-sandbox.sh prepare
