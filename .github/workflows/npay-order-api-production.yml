name: Activate Npay production order API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dayoff-production
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install production credentials, verify history, and enable inventory sync
        uses: appleboy/ssh-action@v1.2.5
        env:
          NPAY_ORDER_API_PRODUCTION_SETUP_B64: ${{ secrets.NPAY_ORDER_API_PRODUCTION_SETUP_B64 }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: NPAY_ORDER_API_PRODUCTION_SETUP_B64
          command_timeout: 12m
          script: |
            set -eu
            cd "${{ secrets.DROPLET_APP_PATH }}"
            test "$(git rev-parse HEAD)" = '${{ github.sha }}'
            sh deploy/setup-npay-order-api-production.sh
